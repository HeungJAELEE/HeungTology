name: Publish missing HeungTology runtime images

on:
  push:
    branches:
      - work/heungtology-agent-evidence-20260810
    paths:
      - '.github/workflows/publish-heungtology-agent-evidence.yml'

permissions:
  contents: write

jobs:
  publish-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: work/heungtology-agent-evidence-20260810
          fetch-depth: 0

      - name: Refresh exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin work/heungtology-agent-evidence-20260810

      - name: Materialize images to temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/heungtology-evidence
          base64 -d .github/runtime-evidence/heungtology-graph-before.webp.b64 > /tmp/heungtology-evidence/heungtology-graph-before.webp
          cat \
            .github/runtime-evidence/heungtology-graphfy-connected.webp.b64.part00 \
            .github/runtime-evidence/heungtology-graphfy-connected.webp.b64.part01 \
            | base64 -d > /tmp/heungtology-evidence/heungtology-graphfy-connected.webp
          cat \
            .github/runtime-evidence/heungtology-agent-document-example.webp.b64.part00 \
            .github/runtime-evidence/heungtology-agent-document-example.webp.b64.part01 \
            .github/runtime-evidence/heungtology-agent-document-example.webp.b64.part02 \
            | base64 -d > /tmp/heungtology-evidence/heungtology-agent-document-example.webp

          test "$(stat -c%s /tmp/heungtology-evidence/heungtology-graph-before.webp)" = '2280'
          test "$(stat -c%s /tmp/heungtology-evidence/heungtology-graphfy-connected.webp)" = '7982'
          test "$(stat -c%s /tmp/heungtology-evidence/heungtology-agent-document-example.webp)" = '15346'
          file /tmp/heungtology-evidence/*.webp | grep -c 'Web/P image' | grep -q '^3$'

      - name: Add ignored images to public main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/evidence
          cp /tmp/heungtology-evidence/*.webp docs/evidence/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/evidence/*.webp
          git diff --cached --check
          git commit -m 'docs: add Graphfy and Gemma runtime screenshots'
          git push origin HEAD:main
